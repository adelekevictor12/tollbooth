# Render blueprint — deploys the Tollbooth marketplace + metered gateway.
#
# One-time setup:
#   1. Render dashboard → New → Blueprint → pick this repo.
#   2. When prompted for the (sync: false) secrets below, leave them blank
#      for a fully-working zero-credential mock demo, or paste your PayPal
#      sandbox keys to run real sandbox payments.
#   3. The "tollbooth-docs" static service needs your APIMatic dashboard API
#      key (apimatic.io → Account Settings → API Keys) — it generates the
#      developer portal at deploy time. Leave it blank only if you delete
#      that service from this file.
#   4. After the first deploy, add a PayPal webhook for the Render URL
#      (see README → "Webhooks") to enable auto credit top-up.
#
# Notes:
# - Node 24 is required (node:sqlite).
# - The free plan's disk is ephemeral: the SQLite DB is rebuilt and the demo
#   listing re-seeded automatically on every deploy/restart (instrumentation.ts).
services:
  - type: web
    name: tollbooth
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm install && npm run build -w app
    startCommand: npm run start -w app
    healthCheckPath: /api/seed
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      # Payments mode — leave BLANK for auto: pasted sandbox credentials →
      # real sandbox payments; no credentials → zero-key mock mode. Set "mock"
      # explicitly only if you want mock despite having credentials.
      - key: PAYPAL_MODE
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Sandbox business account that receives agent payments (payee routing).
      - key: PAYPAL_PAYEE_EMAIL
        sync: false
      # Webhook subscription ID, once you've registered the webhook (optional).
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # APIMatic key unlocks live transform/SDK generation (optional).
      - key: APIMATIC_API_KEY
        sync: false

  # Developer portal for the demo API — static site, generated at deploy time
  # by the APIMatic CLI from portal/src (never sleeps, free).
  - type: web
    name: tollbooth-docs
    runtime: static
    buildCommand: npx -y @apimatic/cli@2 portal generate --input=portal --destination=portal/out --force --auth-key=$APIMATIC_API_KEY
    staticPublishPath: portal/out
    autoDeploy: true
    envVars:
      # Same APIMatic dashboard API key as above (Account Settings → API Keys).
      - key: APIMATIC_API_KEY
        sync: false
